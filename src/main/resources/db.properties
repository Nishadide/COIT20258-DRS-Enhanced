# DRS-Enhanced configuration
#
# Every value here can be overridden without editing this file. The order of
# precedence is:
#
#   1. A JVM system property, for example  -Ddrs.db.password=secret
#   2. An environment variable, for example  DRS_DB_PASSWORD=secret
#   3. This file
#   4. The default built into DatabaseConfig
#
# Use the override rather than editing this file, so that a personal password
# is never committed to the repository.

# ---------------------------------------------------------------------------
# Client
# ---------------------------------------------------------------------------

# How the JavaFX client reaches its data.
#
#   local    The client holds its own repositories, as DRS-Initial did.
#            Nothing else needs to be running. This is the default so that the
#            application always starts, whatever state the server is in.
#
#   remote   The client holds no repositories and asks the server for
#            everything. The server must be running, and through it MySQL.
#            Start it with com.cqu.drs.server.ServerMain.
#
# The setting exists because operations move to the server one at a time.
# Without it the application would have to be broken for as long as that took.
drs.client.mode=local

# ---------------------------------------------------------------------------
# Application server
# ---------------------------------------------------------------------------

# The host the JavaFX client connects to. Leave as localhost unless the server
# is running on another machine.
drs.server.host=localhost

# The port the server listens on and the client connects to. Change this if
# port 5050 is already in use on the marking machine.
drs.server.port=5050

# Maximum number of client connections handled at once. Each connection is
# given one thread from a pool of this size.
drs.server.threads=32

# ---------------------------------------------------------------------------
# MySQL database
# ---------------------------------------------------------------------------

drs.db.host=localhost
drs.db.port=3306
drs.db.name=drs_enhanced

# The MySQL account the server connects with. A standard MySQL installation
# has a root account. If your root password is not blank, set it with
# -Ddrs.db.password=yourpassword rather than writing it here.
drs.db.user=root
drs.db.password=

# When true, the server creates the database and its tables on startup if they
# are not already present. Set to false only if the schema was created by hand.
drs.db.createSchema=true

# JDBC connection parameters.
#
#   sslMode=DISABLED               the server runs on a trusted local machine
#   allowPublicKeyRetrieval=true   required by MySQL 8 caching_sha2_password
#                                  authentication when SSL is disabled.
#                                  Without it, connecting fails with
#                                  "Public Key Retrieval is not allowed"
#   characterEncoding=UTF-8        matches the utf8mb4 database charset
#   rewriteBatchedStatements=true  turns the migration's batched inserts into
#                                  single multi-row statements
#
# No time zone parameter is set. LocalDateTime values are written and read with
# setObject and getObject, which map directly onto the MySQL DATETIME type, so
# no time zone conversion is applied in either direction.
drs.db.params=sslMode=DISABLED&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&rewriteBatchedStatements=true
